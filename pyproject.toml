[project]
name = "sonoran"
version = "0.1.0"
description = "Sonoran Meshtastic dashboard: MQTT ingest, TimescaleDB storage, read-only API, static UI"
readme = "README.md"
# The same licence as LICENSE, the full GNU GPL version 3 text. The
# vendored SPLAT! engine is GPL-3 (docs/PLANNER.md 6), so the project is
# too. Third-party code and data are listed in THIRD_PARTY_NOTICES.md.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.3,<3",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "cryptography>=43",
    "fastapi>=0.115",
    # httpx downloads terrain tiles for the coverage planner.
    "httpx>=0.27",
    # numpy reduces and reorders SRTM elevation tiles.
    "numpy>=2.1",
    "protobuf>=6.31.1,<7",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # pyyaml reads the radio overrides file, which names the antenna and
    # the mast of a node. The mesh cannot report either.
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    # wasmtime runs the vendored SPLAT! engine outside the browser. The
    # same WebAssembly file serves the planner page and the coverage
    # job, so the two cannot predict different things.
    "wasmtime>=25",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Reading the land cover source needs GDAL, and nothing in the running
# system reads it: tools/prefetch_landcover.py makes plain byte pages
# once, and the API and the jobs read those with numpy. So this is its
# own extra and is not installed in CI.
landcover = [
    "rasterio>=1.3",
]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.8",
]

[project.scripts]
sonoran-api = "sonoran.api.app:run"
sonoran-ingest = "sonoran.ingest.pipeline:run"
sonoran-jobs = "sonoran.jobs.scheduler:run"
# One coverage run, now, instead of waiting for the timer. For bringing
# a box up and for watching the first run.
sonoran-coverage-once = "sonoran.jobs.coverage:run"
# One heatmap generation run, now.
sonoran-heatmap-once = "sonoran.jobs.activity_heatmap:run"
# One gap assessment, now, instead of waiting for the timer. The same
# bargain as sonoran-coverage-once.
sonoran-gaps-once = "sonoran.jobs.gaps:run"
# One siting answer, now. It runs the engine, so the schedule puts it
# inside the coverage cycle rather than beside it.
sonoran-gaps-siting-once = "sonoran.jobs.gaps_siting:run"
# What rf-agent stations publish. See docs/design/rf-map.md.
sonoran-rf-ingest = "sonoran.rf.ingest:run"
# Remove one RF station's data after its login is revoked. A dry run
# unless --yes. Run it in the migrate service, which holds the owner.
sonoran-rf-purge = "sonoran.rf.purge:run"
# Trust levels and hidden mods for RF stations (#324). Run in `migrate`.
sonoran-rf-trust = "sonoran.rf.operator:run"
# Jobs for members' contributors, and their results (#178).
sonoran-contrib = "sonoran.contrib.service:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonoran"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/sonoran/meshtastic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/sonoran/api/routes/**" = ["B008"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["sonoran"]
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_unreachable = true
exclude = ["^src/sonoran/meshtastic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/sonoran"]
branch = true

[tool.coverage.report]
show_missing = true
