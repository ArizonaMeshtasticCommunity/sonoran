# A log driver for every service, and a ceiling on what it keeps.
#
# The default json-file driver has no limit, so a service that starts
# logging an error every few milliseconds writes until the disk is full.
# This box shares a 15 GB filesystem with another account, so filling it
# is not a local fault: it takes down the other person's work and the
# database along with it. 20 MB times three files is 60 MB per service,
# 360 MB for the stack.
#
# This is the shape the Sonoran clause asks for: a resource a service
# can consume without bound is a resource it will eventually consume.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# Every credential in `.env`, blanked.
#
# `env_file: .env` hands a service the whole file, and `.env` holds the
# Postgres superuser password, the superuser migration DSN, one DSN for
# each of the three least-privilege roles, and the login password of
# each of those roles. A service that receives all of them has the
# three-role split on paper only: anything that reads `os.environ` — a
# crash reporter, a debug dump, a shell in a running container — hands
# over the superuser.
#
# `extra="ignore"` in `sonoran/config.py` means the application already
# ignores the values it has no field for. That is not the point. The
# value is still in the process environment, and the environment is
# what leaks.
#
# So each service merges this and then grants back exactly the one
# credential it uses. The empty strings are deliberate: `environment`
# overrides `env_file`, and blanking is how a key is taken back off a
# service without splitting `.env` into one file per role.
#
# A credential added to `.env` later must be added here too, or it is
# shared with every service by default. See docs/ARCHITECTURE.md.
#
# AND THIS FILE IS NOT THE LAST WORD. Compose reads
# `docker-compose.override.yml` automatically, and an `env_file` named
# there is ADDED to the service rather than replacing what is here. An
# override that lists `.env` hands that service the whole file again,
# whatever this file says. It happened: the deployment's override gave
# mesh-graph `env_file: [.env, .env.emqx]`, so the allowlist below sat
# in this file while the container held 8 credentials.
#
# Verify with `docker compose config`, which prints what each service
# actually receives, overrides included. Never by reading this file.
x-no-credentials: &no-credentials
  DATABASE_URL: ""
  DATABASE_URL_API: ""
  DATABASE_URL_JOBS: ""
  DATABASE_URL_MIGRATE: ""
  POSTGRES_PASSWORD: ""
  AZMSH_INGEST_PASSWORD: ""
  AZMSH_API_PASSWORD: ""
  AZMSH_JOBS_PASSWORD: ""
  # The Meshtastic channel keys decrypt traffic off the air. Only the
  # ingest process decrypts anything: `sonoran/ingest/pipeline.py` is
  # the one reader of `settings.channel_keys` in the whole package.
  # The api and the jobs held them because the file was handed over
  # whole, not because anything asked.
  CHANNEL_KEYS: ""

# The broker passwords. Each one is blanked in every service but the one
# that logs in with it, which takes it from its env files untouched. Not
# `environment: {X: ${X}}` there: `environment` beats every `env_file`,
# and would replace a password a host gives in its own override file.
# `tests/unit/test_broker_credentials.py` pins it.
x-no-mqtt: &no-mqtt
  MQTT_PASSWORD: ""
x-no-rf-mqtt: &no-rf-mqtt
  RF_MQTT_PASSWORD: ""
x-no-contrib-mqtt: &no-contrib-mqtt
  CONTRIB_MQTT_PASSWORD: ""

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    logging: *logging
    networks:
      sonoran-internal:
        aliases:
          - ${DB_HOSTNAME:-timescaledb}
    environment:
      POSTGRES_DB: azmsh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # The timescaledb-ha image keeps PGDATA at /home/postgres/pgdata,
      # not /var/lib/postgresql/data. Mounting the volume on the wrong
      # path leaves the data in the container's writable layer, where it
      # is lost the moment the container is recreated. Mount the real
      # data home so it survives. See tools/db_backup.sh.
      - tsdb_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d azmsh"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    logging: *logging
    networks:
      - default
      - sonoran-internal
    command: ["sonoran-api"]
    # Ask the application, not the port.
    #
    # A container whose process is alive but wedged still accepts a TCP
    # connection, so `Up` says nothing. /health is served by the app
    # itself, which is the difference between a probe that asserts
    # function and one that only proves something is listening.
    #
    # ingest and jobs have no HTTP server, so they get no healthcheck
    # here rather than a decorative one. A real probe for them has to
    # read a heartbeat they do not yet write; see docs/ISSUES.md.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)\""]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    env_file: .env
    # The API is the process on the public internet, and it reads the
    # SELECT-only role and nothing else. See `x-no-credentials`.
    environment:
      <<: [*no-credentials, *no-mqtt, *no-rf-mqtt, *no-contrib-mqtt]
      DATABASE_URL_API: ${DATABASE_URL_API:?set DATABASE_URL_API in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    volumes:
      # Terrain pages for the coverage planner. They are made once and
      # never change, so they must survive a rebuild of the image.
      - terrain_cache:/var/lib/sonoran/terrain
      # Land cover pages, made once by tools/prefetch_landcover.py.
      - landcover_cache:/var/lib/sonoran/landcover
      # The coverage tiles. The jobs service writes them and this one
      # serves them.
      - coverage_cache:/var/lib/sonoran/coverage
    # Loopback only. A bare "8000:8000" publishes on every interface,
    # and on a standard (rootful) Docker install published ports bypass
    # ufw, so the dashboard would be open to the internet with no
    # reverse proxy in front of it. A
    # deployment that needs another address says so in its override.
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_BIND_PORT:-8000}:${WEB_PORT:-8000}"

  migrate:
    build: .
    restart: "no"
    logging: *logging
    networks:
      - sonoran-internal
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    # The one service that holds the superuser, because it is the one
    # service that creates the roles and changes the schema.
    #
    # The three role passwords are here and nowhere else. Revision 0001
    # reads them to create the roles and refuses to run without them,
    # so a deployment cannot come up on a default password. They are
    # passed through rather than demanded with `:?` so that the
    # migration is the single place that reports the fault, with the
    # variable named — a `:?` here would stop unrelated commands such
    # as `docker compose up -d timescaledb` as well.
    environment:
      <<: [*no-credentials, *no-mqtt, *no-rf-mqtt, *no-contrib-mqtt]
      DATABASE_URL_MIGRATE: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@${DB_HOSTNAME:-timescaledb}:5432/azmsh
      AZMSH_INGEST_PASSWORD: ${AZMSH_INGEST_PASSWORD:-}
      AZMSH_API_PASSWORD: ${AZMSH_API_PASSWORD:-}
      AZMSH_JOBS_PASSWORD: ${AZMSH_JOBS_PASSWORD:-}
    depends_on:
      timescaledb:
        condition: service_healthy

  ingest:
    build: .
    restart: unless-stopped
    logging: *logging
    networks:
      - sonoran-internal
    command: ["sonoran-ingest"]
    env_file: .env
    # INSERT and UPDATE on the payload tables, and nothing else.
    # See `x-no-credentials`.
    environment:
      <<: [*no-credentials, *no-rf-mqtt, *no-contrib-mqtt]
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      # The one process that decrypts anything off the air.
      CHANNEL_KEYS: ${CHANNEL_KEYS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy

  # The RF map (docs/design/rf-map.md). Off unless asked for:
  #   docker compose --profile rf up -d rf-ingest
  # It writes as the ingest role, and reads its own broker settings,
  # `RF_MQTT_*`, because member stations publish to the broker they can
  # reach. It never sees the Meshtastic channel keys.
  rf-ingest:
    build: .
    restart: unless-stopped
    logging: *logging
    networks:
      - sonoran-internal
    profiles: ["rf"]
    command: ["sonoran-rf-ingest"]
    env_file: .env
    environment:
      <<: [*no-credentials, *no-mqtt, *no-contrib-mqtt]
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy

  # Contributors (#178, docs/design/contributors.md). Off by default:
  #   docker compose --profile contrib up -d contrib
  # It holds the only broker login that may publish jobs (CONTRIB_MQTT_*),
  # and writes as the jobs role, which can read node roles.
  contrib:
    build: .
    restart: unless-stopped
    logging: *logging
    profiles: ["contrib"]
    command: ["sonoran-contrib"]
    env_file: .env
    environment:
      <<: [*no-credentials, *no-mqtt, *no-rf-mqtt]
      DATABASE_URL_JOBS: ${DATABASE_URL_JOBS:?set DATABASE_URL_JOBS in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy

  jobs:
    build: .
    restart: unless-stopped
    logging: *logging
    networks:
      - sonoran-internal
    command: ["sonoran-jobs"]
    # A small init as PID 1 (#371). The jobs supervisor stops a job over
    # its memory ceiling by killing its process tree; the processes below
    # the job are then re-parented to PID 1, and only an init reaps them.
    init: true
    env_file: .env
    # Contain the coverage job's memory to the container that uses it.
    #
    # The coverage prediction is the largest thing this deployment runs,
    # and on a small box it does not fit: on the dev box it is killed by
    # the OOM killer part-way through every run, exit 137.
    #
    # Without a limit that kill is the KERNEL's choice, made by score
    # across the whole machine, and the scores do not favour us.
    # Measured on that box with the jobs container already stopped:
    #
    #     816  sonoran-api
    #     815  postgres
    #     815  postgres
    #     810  mesh-graph
    #
    # The API is the likeliest victim -- the one process a reader
    # actually depends on. A limit here moves the kill into this
    # container's own cgroup, so the job that cannot fit is the thing
    # that dies, and `docker inspect` reports OOMKilled=true instead of
    # leaving a bare 137 to diagnose.
    #
    # Zero means unlimited, which is docker's default and is what every
    # deployment gets unless it asks. A number that is right for a
    # 3.4 GB box would be wrong for a large one, so this is a setting
    # and not a constant. See docs/OPERATIONS.md.
    mem_limit: ${JOBS_MEMORY_LIMIT:-0}
    # The jobs role, and nothing else. See `x-no-credentials`.
    environment:
      <<: [*no-credentials, *no-mqtt, *no-rf-mqtt, *no-contrib-mqtt]
      DATABASE_URL_JOBS: ${DATABASE_URL_JOBS:?set DATABASE_URL_JOBS in .env}
    volumes:
      # The coverage job reads terrain and land cover, and writes the
      # coverage tiles the API serves. All three are shared with the
      # api service, which only reads them.
      - terrain_cache:/var/lib/sonoran/terrain
      - landcover_cache:/var/lib/sonoran/landcover
      - coverage_cache:/var/lib/sonoran/coverage
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy

  mesh-graph:
    # Third party code, pinned by digest.
    #
    # `latest` means whatever its author last pushed becomes the code
    # running on this box at the next pull, with no review here and no
    # record of which build ran. The tag is kept in the reference so a
    # reader can see what it tracks, but the digest is what Docker
    # resolves, so the tag cannot be moved underneath us.
    # `docs/PLAN.md` already named pinning this tag as the mitigation
    # for the risk; this is that.
    #
    # It does mean a security fix upstream does not arrive on its own.
    # That is the trade taken on purpose: this image now holds four MQTT
    # variables and a SQLite file, so an unreviewed change to it is the
    # larger of the two risks. Updating is one line and belongs in its
    # own commit:
    #
    #   docker manifest inspect ghcr.io/ianmcorvidae/mesh-graph:latest
    image: ghcr.io/ianmcorvidae/mesh-graph:latest@sha256:7126a91d0952e1f0cb1a456ba661cdb8562aa95781bfc6a507f5d375ba2510c2
    restart: unless-stopped
    
    logging: *logging
    networks:
      - sonoran-internal
    # No `env_file`. This is the one service in the stack that is not
    # our code, and `.env` holds the Postgres superuser password, four
    # database DSNs, the three role passwords and the Meshtastic channel
    # keys. None of that has anything to do with drawing a traceroute.
    #
    # Its command below reads four variables. It is given four.
    #
    # These are `environment:`, and `environment:` beats `env_file:`.
    # An override that adds `env_file: [.env.other]` to this service
    # therefore changes none of the four: they still come from `.env`.
    # To point this service at a different broker, set the keys under
    # `environment:` in the override, or start it with
    # `environment: !reset {}` and then name the env file.
    environment:
      MQTT_HOST: ${MQTT_HOST:?set MQTT_HOST in .env}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    entrypoint: ["sh", "-c"]
    volumes:
      - meshgraph_data:/data
      - ./config:/config:ro
    # Loopback only, as for the api above.
    ports:
      - "${GRAPH_BIND_IP:-127.0.0.1}:${GRAPH_BIND_PORT:-8080}:${GRAPH_PORT:-8080}"
    # Writes the broker, port and login into a copy of the config.
    # `broker` in mesh-graph.config.toml is replaced by MQTT_HOST, so
    # the host and port come from the environment like the ingest's do,
    # and are not a second copy of the broker address that can disagree.
    command: ["awk -v host=\"$$MQTT_HOST\" -v port=\"$$MQTT_PORT\" -v user=\"$$MQTT_USERNAME\" -v pass=\"$$MQTT_PASSWORD\" '/^broker[[:space:]]*=/{print \"broker = \\\"\" host \"\\\"\"; next} {print} /^\\[mqtt\\]/{print \"port = \" port; print \"username = \\\"\" user \"\\\"\"; print \"password = \\\"\" pass \"\\\"\"}' /config/mesh-graph.config.toml > /tmp/config.toml && mesh-graph --config /tmp/config.toml --mode both"]

  backup:
    # A daily logical dump of the database, kept in rotation. See
    # tools/db_backup_scheduled.sh and docs/DATABASE.md section 9.
    #
    # It is its own service and not a task in `jobs`, for two reasons.
    # The jobs process has the azmsh_jobs role only, and the roles dump
    # needs the superuser. And pg_dump must have the major version of
    # the server, which the database image gives and the app image does
    # not.
    build:
      context: .
      dockerfile: tools/backup.Dockerfile
    restart: unless-stopped
    logging: *logging
    networks:
      - sonoran-internal
    # No `env_file`, for the same reason as mesh-graph: this service
    # gets the one credential it uses, and nothing else from `.env`.
    environment:
      PGHOST: ${DB_HOSTNAME:-timescaledb}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: azmsh
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_FAIL_LIMIT: ${BACKUP_FAIL_LIMIT:-3}
    # The uid that writes the files. The default is the postgres user of
    # the image. Under rootless Docker, set 0: root in the container is
    # the account that runs Docker, so the files on the host belong to
    # that account. See .env.example.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    # pg_dump streams, so it needs little memory. The limit keeps a
    # fault here out of the rest of the box.
    mem_limit: ${BACKUP_MEMORY_LIMIT:-512m}
    volumes:
      # A host directory, not a named volume, so a person can find the
      # files and copy them off the box without Docker.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    healthcheck:
      # Unhealthy when the last good backup is older than the interval
      # plus 12 hours, so a backup that has stopped is visible.
      test: ["CMD", "/usr/local/bin/sonoran-backup", "check"]
      interval: 5m
      timeout: 10s
      start_period: 30m
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  tsdb_data:
  meshgraph_data:
  terrain_cache:
  landcover_cache:
  coverage_cache:

networks:
  # The backend's own network, apart from any shared proxy network the
  # api joins, so two stacks on one host cannot reach each other's
  # containers by name. Not `internal`: ingest, rf-ingest and mesh-graph
  # read an MQTT broker outside the stack, and jobs fetches terrain and
  # land cover, so they need a route out.
  sonoran-internal: {}
