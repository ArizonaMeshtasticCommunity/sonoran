# Say when the vendored config checker falls behind upstream.
#
# `web/static/vendor/config-checker` is pinned to one commit and
# nothing else tells us when upstream moves. `tools/check_config_
# checker_pin.sh` has existed for this since #61 and nothing ran it,
# which is the same silent-staleness the script was written to stop.
#
# NOT part of CI, deliberately. Upstream moving is not a fault in a
# pull request, and a job that fails somebody's unrelated PR for it
# gets ignored or switched off within a week. This runs on its own
# schedule, so a red run means exactly one thing: go and look at the
# vendored copy.
name: Vendor pin

on:
  schedule:
    # Mondays, early. Weekly is enough for a dependency that moves in
    # releases rather than commits.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# The checkout token reads the repository and nothing else. Each
# action is pinned by commit; see ci.yml.
permissions:
  contents: read

jobs:
  config-checker:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Compare the pin with upstream
        env:
          # The upstream repository is private, so the checkout token
          # is what lets `git ls-remote` read it.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          set +e
          out="$(bash tools/check_config_checker_pin.sh 2>&1)"
          status=$?
          echo "$out"
          {
            echo "## Vendored config checker"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 = current, 1 = upstream moved, 2 = could not run.
          #
          # All three of 1 and 2 fail. The first version of this exited 0
          # on 2, reasoning that a check which cannot reach upstream is
          # not evidence anything is wrong. That was the wrong test: this
          # job exists to answer "is the vendored copy current", and
          # "could not check" is not a no, it is **I do not know**. An
          # unknown reported as success is a monitor that has stopped
          # working while still looking healthy.
          #
          # It was not hypothetical. The first real run, dispatched by
          # hand on 2026-09-26, printed "cannot read the upstream head"
          # and reported SUCCESS. GITHUB_TOKEN is scoped to this
          # repository, so it cannot read the separate private
          # config-checker repo, and the `insteadOf` rewrite above does
          # not change that. The steady state was green and blind -- for
          # a job whose whole purpose is to notice silence.
          if [ "$status" -eq 2 ]; then
            echo "::error::the pin check could not run, so whether the vendored copy is current is UNKNOWN. It needs a token that can read the private config-checker repository (GITHUB_TOKEN cannot); set one as a secret and use it above."
            exit 1
          fi
          exit "$status"
