name: CI

on:
  push:
    branches: [main]
  # Not `pull_request`. With `pull_request`, GitHub reads this file from
  # the pull request, so a fork can delete the guard below in its own
  # copy. With `pull_request_target`, GitHub reads this file from `main`.
  # The runner group `sonoran-public` also accepts only the workflows at
  # `refs/heads/main`, so a workflow of a pull request gets no runner.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

# The token of each job may read the repository and nothing else. No
# job here writes to GitHub: no release, no comment, no package. A step
# that is compromised then holds a token that cannot change anything.
# The Actions cache needs no permission of this token.
#
# Each action is pinned by commit, with its release as a comment. A
# tag such as `v4` can be moved by the owner of the action, and a
# commit cannot. To update one, read the commit of the new release
# (`git ls-remote https://github.com/<owner>/<action> refs/tags/<tag>`)
# and change both halves together. test_ci_workflows.py checks it.
permissions:
  contents: read

# A pull request from a fork runs only when a triager approves it.
#
# Every job runs on self-hosted hardware that belongs to a community
# member (AGENTS.md 6.2), and the jobs can reach Docker there. Each job
# runs in its own Firecracker microVM (label `sonoran-microvm`), which is
# destroyed when the job ends, so a job cannot keep the machine or reach
# the next job. A pull request from a fork can still change any test or
# the Dockerfile and run its author's code in that VM, with the
# internet. So each job runs only:
#
# 1. for a push to main;
# 2. for a pull request from a branch of this repository. Only a person
#    with write access can push a branch here;
# 3. when somebody adds the label `ci:approved` to a pull request. Only
#    a person with the triage role or higher can add a label. The run
#    tests the commit that was the head when the label was added.
#
# A new push to a fork's pull request starts nothing. To test it, read
# the new commits, then remove the label and add it again. Read the
# whole change first, the tests and the Dockerfile too. Never add the
# label to a change that you did not read.
#
# `pull_request_target` runs with the rights of `main`. So no job here
# reads a secret, the token can only read, and checkout does not keep
# the token. Do not add a secret or a write permission to this file.
#
# actions/checkout refuses to check out a fork in this event. Each
# checkout here sets `allow-unsafe-pr-checkout` only for the event that
# adds `ci:approved`. That is safe here only because the job runs in a
# microVM that is destroyed, with no secret and a token that can only
# read. Change none of these without the agreement of the runner's
# owner. See https://gh.io/securely-using-pull_request_target.
#
# This needs the agreement of the runner's owner. test_ci_workflows.py
# checks the guard and the checkout on each job.
jobs:
  lint:
    runs-on: [self-hosted, sonoran-microvm]
    if: >-
      github.event_name == 'push'
      || (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'labeled')
      || (github.event.action == 'labeled' && github.event.label.name == 'ci:approved')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # checkout refuses the commit of a fork here, unless this is true.
          # It is true only for the commit that a triager approved.
          allow-unsafe-pr-checkout: ${{ github.event.action == 'labeled' && github.event.label.name == 'ci:approved' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      # The frontend has no build step and no ESLint until now, so a name
      # that was deleted could still be referenced and nothing noticed until
      # a reader's browser threw. Six of those in one session (#248).
      # Steps in this job rather than a job of its own: every job here runs
      # on self-hosted hardware, and a new job is a new runner allocation.
      # package-lock.json pins the versions; see eslint.config.mjs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          check-latest: true
          # A fork can name a package manager in package.json, and that
          # turns this cache on. Here it would be the cache of main.
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint

  typecheck:
    runs-on: [self-hosted, sonoran-microvm]
    if: >-
      github.event_name == 'push'
      || (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'labeled')
      || (github.event.action == 'labeled' && github.event.label.name == 'ci:approved')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # checkout refuses the commit of a fork here, unless this is true.
          # It is true only for the commit that a triager approved.
          allow-unsafe-pr-checkout: ${{ github.event.action == 'labeled' && github.event.label.name == 'ci:approved' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --extra dev
      - run: uv run mypy src

  test:
    runs-on: [self-hosted, sonoran-microvm]
    if: >-
      github.event_name == 'push'
      || (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'labeled')
      || (github.event.action == 'labeled' && github.event.label.name == 'ci:approved')
    env:
      # This job runs the 166 database-backed tests in tests/integration
      # as well as the unit suite, and it starts their container itself
      # through testcontainers. If that ever stops working -- Docker
      # missing from a runner, an image that will not pull -- the suite
      # skips them and still reports green, because pytest counts a skip
      # and a pass on the same line.
      #
      # That is not hypothetical. The same tests skipped on every
      # developer Mac running Colima for months, and a real failure in
      # /api/chat/overview reached this workflow behind the silence.
      # Here, where the result gates a merge, a container that will not
      # start is a failure and not a quiet subtraction of 166 tests.
      SONORAN_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # checkout refuses the commit of a fork here, unless this is true.
          # It is true only for the commit that a triager approved.
          allow-unsafe-pr-checkout: ${{ github.event.action == 'labeled' && github.event.label.name == 'ci:approved' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # The unit suite runs JavaScript with node, and a test fails when
      # node is missing. A microVM has no node until this step installs
      # it. The old shared runner had node on the machine.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          check-latest: true
          # A fork can name a package manager in package.json, and that
          # turns this cache on. Here it would be the cache of main.
          package-manager-cache: false
      - run: uv sync --extra dev
      - run: >-
          uv run pytest
          --cov=sonoran.decode
          --cov=sonoran.crypto
          --cov=sonoran.ingest
          --cov-report=term-missing
          --cov-fail-under=80

  migrations:
    runs-on: [self-hosted, sonoran-microvm]
    if: >-
      github.event_name == 'push'
      || (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'labeled')
      || (github.event.action == 'labeled' && github.event.label.name == 'ci:approved')
    services:
      timescaledb:
        # Pinned by digest. `pg17` is a moving tag: it changed 6 times in
        # 14 days, and each change pulled and unpacked about 4 GB again on
        # the shared, slow disk of the old runners. The days with the most
        # pulls had the most failures. The Docker Hub cache on the microVM
        # host keeps one copy of this digest for every VM. To update it,
        # change the digest on purpose, in
        # its own commit, here, in the e2e service and in
        # tests/integration/conftest.py (test_ci_database_image.py holds
        # the three to one value).
        image: timescale/timescaledb-ha:pg17@sha256:e77fc7a0395b63a89d27b8b5043abcc7e8120576429ea9a470977d4bed3d0261
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sonoran
        # Docker picks the host port. A microVM runs one job only, so a
        # fixed 5432 would work there. A free port keeps this job correct
        # on any other machine too, for example one with its own
        # Postgres. The first step points the URL below at whichever port
        # this got.
        ports:
          - 5432
        # The health check uses `-h 127.0.0.1` deliberately. A bare
        # `pg_isready` checks the WRONG SERVER: this image initialises
        # by starting a temporary postgres with `-c listen_addresses=''`
        # -- its own entrypoint calls it the "socket-only postgresql
        # server" -- and runs the initdb scripts against it over the
        # unix socket. `pg_isready` with no host uses that same socket,
        # so it answers "accepting connections" while there is no TCP
        # listener at all. The service is marked healthy, the job
        # starts, and the first connection to the mapped port is
        # accepted by Docker's proxy and immediately closed:
        #
        #     psycopg.OperationalError: connection failed: server
        #     closed the connection unexpectedly
        #
        # Measured against this exact image with listen_addresses='':
        #
        #     pg_isready                  accepting connections  (0)
        #     pg_isready -h 127.0.0.1     no response            (2)
        #
        # It was intermittent because it is a race between how long
        # `uv sync` takes and how long the toolkit extensions take. On
        # run 35880147556: healthy at 15:15:20, connected at 15:15:46,
        # and the init server had still not handed over at 15:15:51.
        # Over TCP the check cannot pass before the real server is
        # listening, which is the thing the job actually needs to know.
        # `--tmpfs` puts the database's files in RAM, not on the runner's
        # disk. The database is thrown away when the job ends, and the
        # disk is too slow at synchronous writes: the image's init server
        # could not flush its shutdown checkpoint in 60 s under load, and
        # the container exited 1. Measured on the old shared runner VM, ready over
        # TCP: 14.8 s on disk on a quiet box and over 60 s under load,
        # 5.1 s on tmpfs whatever the load. The path is $PGDATA in this
        # image (mounting its parent fails: root owns a new tmpfs). uid
        # 1000 is postgres, and initdb needs mode 0700. Raise `size` if
        # Postgres ever says "No space left on device".
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d sonoran"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --tmpfs /home/postgres/pgdata/data:rw,uid=1000,gid=1000,mode=0700,size=2g
    env:
      DATABASE_URL_MIGRATE: postgresql+psycopg://postgres:test@localhost:5432/sonoran
      # Revision 0001 creates the three least-privilege roles and has no
      # default password for them: a missing, empty or placeholder value
      # stops the migration with the variable named. That is the point —
      # a deployment must not come up on a password published in this
      # repository — and it applies to CI like anywhere else.
      #
      # These are throwaway values for a throwaway container that lives
      # for the length of this job and is never reachable from outside
      # it. They must not be `change_me` or `CHANGE_ME`, which the
      # migration refuses by name.
      AZMSH_INGEST_PASSWORD: ci-ingest-not-a-real-password
      AZMSH_API_PASSWORD: ci-api-not-a-real-password
      AZMSH_JOBS_PASSWORD: ci-jobs-not-a-real-password
    steps:
      - name: Point at this job's database
        run: >-
          echo "DATABASE_URL_MIGRATE=${DATABASE_URL_MIGRATE/localhost:5432/localhost:${{ job.services.timescaledb.ports['5432'] }}}"
          >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # checkout refuses the commit of a fork here, unless this is true.
          # It is true only for the commit that a triager approved.
          allow-unsafe-pr-checkout: ${{ github.event.action == 'labeled' && github.event.label.name == 'ci:approved' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --extra dev
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade -1
      - run: uv run alembic upgrade head

  # The nineteen user journeys in tools/dev/e2e.js.
  #
  # They existed and nothing ran them, so a reflow regression shipped
  # that this suite catches by name (#82, #83). `check_pages.js` fails
  # on a page that throws; these fail on a page that loads happily and
  # does nothing useful, which is the class that got through.
  #
  # Seeded data, not the live instance: a journey that gates a merge
  # has to be deterministic. The nightly-against-production idea is in
  # #83 and is deliberately not this job.
  e2e:
    runs-on: [self-hosted, sonoran-microvm]
    if: >-
      github.event_name == 'push'
      || (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'labeled')
      || (github.event.action == 'labeled' && github.event.label.name == 'ci:approved')
    services:
      timescaledb:
        # Pinned by digest. `pg17` is a moving tag: it changed 6 times in
        # 14 days, and each change pulled and unpacked about 4 GB again on
        # the shared, slow disk of the old runners. The days with the most
        # pulls had the most failures. The Docker Hub cache on the microVM
        # host keeps one copy of this digest for every VM. To update it,
        # change the digest on purpose, in
        # its own commit, here, in the e2e service and in
        # tests/integration/conftest.py (test_ci_database_image.py holds
        # the three to one value).
        image: timescale/timescaledb-ha:pg17@sha256:e77fc7a0395b63a89d27b8b5043abcc7e8120576429ea9a470977d4bed3d0261
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: azmsh
        # Docker picks the host port, as in `migrations`.
        ports:
          - 5432
        # The health check uses `-h 127.0.0.1` deliberately. A bare
        # `pg_isready` checks the WRONG SERVER: this image initialises
        # by starting a temporary postgres with `-c listen_addresses=''`
        # -- its own entrypoint calls it the "socket-only postgresql
        # server" -- and runs the initdb scripts against it over the
        # unix socket. `pg_isready` with no host uses that same socket,
        # so it answers "accepting connections" while there is no TCP
        # listener at all. The service is marked healthy, the job
        # starts, and the first connection to the mapped port is
        # accepted by Docker's proxy and immediately closed:
        #
        #     psycopg.OperationalError: connection failed: server
        #     closed the connection unexpectedly
        #
        # Measured against this exact image with listen_addresses='':
        #
        #     pg_isready                  accepting connections  (0)
        #     pg_isready -h 127.0.0.1     no response            (2)
        #
        # It was intermittent because it is a race between how long
        # `uv sync` takes and how long the toolkit extensions take. On
        # run 35880147556: healthy at 15:15:20, connected at 15:15:46,
        # and the init server had still not handed over at 15:15:51.
        # Over TCP the check cannot pass before the real server is
        # listening, which is the thing the job actually needs to know.
        # `--tmpfs` puts the database's files in RAM, not on the runner's
        # disk. The database is thrown away when the job ends, and the
        # disk is too slow at synchronous writes: the image's init server
        # could not flush its shutdown checkpoint in 60 s under load, and
        # the container exited 1. Measured on the old shared runner VM, ready over
        # TCP: 14.8 s on disk on a quiet box and over 60 s under load,
        # 5.1 s on tmpfs whatever the load. The path is $PGDATA in this
        # image (mounting its parent fails: root owns a new tmpfs). uid
        # 1000 is postgres, and initdb needs mode 0700. Raise `size` if
        # Postgres ever says "No space left on device".
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d azmsh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --tmpfs /home/postgres/pgdata/data:rw,uid=1000,gid=1000,mode=0700,size=2g
    env:
      DATABASE_URL_MIGRATE: postgresql+psycopg://postgres:test@localhost:5432/azmsh
      # Throwaway values for a throwaway container, as in `migrations`.
      # They must not be `change_me`, which revision 0001 refuses.
      AZMSH_INGEST_PASSWORD: ci-ingest-not-a-real-password
      AZMSH_API_PASSWORD: ci-api-not-a-real-password
      AZMSH_JOBS_PASSWORD: ci-jobs-not-a-real-password
      # The API reads DATABASE_URL_API, and the gaps job DATABASE_URL_JOBS.
      # Each must match the matching AZMSH_*_PASSWORD above, and the
      # database here is `azmsh`, not the `sonoran` the defaults name.
      DATABASE_URL_API: postgresql+asyncpg://azmsh_api:ci-api-not-a-real-password@localhost:5432/azmsh
      DATABASE_URL_JOBS: postgresql+asyncpg://azmsh_jobs:ci-jobs-not-a-real-password@localhost:5432/azmsh
      SEED_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/azmsh
      # The gaps assessment is written under the coverage cache, which
      # defaults to /var/lib/sonoran and is not writable on a runner.
      # The API reads it back from the same setting, so both steps need
      # this and they need it to agree. Both are set by the first step,
      # under the job's own temporary directory. A microVM starts empty,
      # but on a machine that keeps its disk, two runs then never read
      # each other's artefacts.
      #
      # No basemap in CI. The default is tile.openstreetmap.org, which
      # answers a datacenter address with 403, and the suite counts a
      # console error as a failure -- correctly, since that is how a
      # silently broken page is caught. A run that gates a merge should
      # not depend on somebody else's server being willing to serve it
      # either. The maps still draw their own layers; only the basemap
      # is absent, and the code already handles an empty tile URL.
      MAP_TILE_URL: ''
    steps:
      # Nothing here assumes a fixed port or path, so these steps work
      # in a microVM and on a machine that also runs other things: the
      # database is on
      # whatever port Docker gave it, the API takes a free port and
      # listens only on loopback, and the caches live in this job's
      # temporary directory.
      - name: Give this job its own ports and caches
        run: |
          db=${{ job.services.timescaledb.ports['5432'] }}
          web=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          for v in DATABASE_URL_MIGRATE DATABASE_URL_API DATABASE_URL_JOBS SEED_DATABASE_URL; do
            echo "$v=${!v/localhost:5432/localhost:$db}" >> "$GITHUB_ENV"
          done
          {
            echo "WEB_HOST=127.0.0.1"
            echo "WEB_PORT=$web"
            echo "SONORAN_URL=http://127.0.0.1:$web"
            echo "COVERAGE_CACHE_DIR=$RUNNER_TEMP/sonoran-coverage"
            echo "TERRAIN_CACHE_DIR=$RUNNER_TEMP/sonoran-terrain"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # checkout refuses the commit of a fork here, unless this is true.
          # It is true only for the commit that a triager approved.
          allow-unsafe-pr-checkout: ${{ github.event.action == 'labeled' && github.event.label.name == 'ci:approved' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          check-latest: true
          # A fork can name a package manager in package.json, and that
          # turns this cache on. Here it would be the cache of main.
          package-manager-cache: false
      - run: uv sync --extra dev
      - run: uv run alembic upgrade head
      - run: uv run python tools/dev/seed.py
      # The gaps page reads the rows the gaps job wrote (#351), so
      # without this the gaps journeys walk an empty page.
      - run: uv run sonoran-gaps-once
      - name: Install the browser
        # Installed into the workspace so `require('playwright')` in
        # e2e.js resolves it; that lookup is by name, with two absolute
        # fallbacks that only exist on a developer's machine.
        #
        # `--with-deps` installs Chromium's system libraries with sudo
        # apt. Hosted runners need it and allow it. The microVM image
        # has the libraries installed already (ci-runner,
        # image/Dockerfile), so there it is not needed.
        run: |
          npm ci --ignore-scripts
          npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - name: Start the API
        run: |
          uv run sonoran-api &
          for i in $(seq 1 60); do
            curl -sf "$SONORAN_URL/api/stats" >/dev/null && break
            sleep 2
          done
          curl -sf "$SONORAN_URL/api/stats" >/dev/null \
            || { echo "the API did not come up"; exit 1; }
      - name: Walk the journeys
        run: node tools/dev/e2e.js

  docker:
    runs-on: [self-hosted, sonoran-microvm]
    if: >-
      github.event_name == 'push'
      || (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'labeled')
      || (github.event.action == 'labeled' && github.event.label.name == 'ci:approved')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # checkout refuses the commit of a fork here, unless this is true.
          # It is true only for the commit that a triager approved.
          allow-unsafe-pr-checkout: ${{ github.event.action == 'labeled' && github.event.label.name == 'ci:approved' }}
      # No setup-buildx-action. It made a new BuildKit container for every
      # job, with an empty cache, and asked it for GPU access, which the
      # runners refuse and it retried without. Docker's built-in builder
      # reads `# syntax=docker/dockerfile:1` too. Each microVM starts
      # with an empty build cache. Its base images come from the Docker
      # Hub cache on the runner host, so they are not downloaded again.
      - run: docker build -t sonoran:ci .
